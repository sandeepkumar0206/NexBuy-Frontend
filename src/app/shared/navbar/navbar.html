<mat-toolbar color="primary" class="navbar">
  <a routerLink="/" class="brand">NexBuy</a>
  <span class="spacer"></span>
  <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
  <a mat-button routerLink="/products" routerLinkActive="active">Products</a>
  <a mat-button routerLink="/cart" routerLinkActive="active">
    <mat-icon>shopping_cart</mat-icon>
    Cart
  </a>
  @if (auth.user(); as user) {
    <span class="user-name">{{ user.name }}</span>
    <button mat-button type="button" (click)="logout()">Logout</button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active">Login</a>
    <a mat-button routerLink="/register" routerLinkActive="active">Register</a>
  }
</mat-toolbar>
